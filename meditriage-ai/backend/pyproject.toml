[project]
name = "meditriage-backend"
version = "0.1.0"
description = "MediTriage AI - Geriatric-focused clinical decision-support and triage backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    "httpx>=0.27.0",
    "reportlab>=5.0.0",
    "chromadb>=1.5.9",
    "google-genai>=2.25.0",
    "psycopg2-binary>=2.9.9",
    "pyotp>=2.10.0",
    "pillow>=10.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "pip-audit>=2.10.1",
]
